  if(typeof state.scope==='number'){
    const start=state.scope*100;

  }

}
function current(){let p=pool();return p[Math.min(state.index,p.length-1)]}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function nav(tab){state.tab=tab;state.index=0;state.revealed=false;state.quiz=null;state.complete=false;if(tab==='typing')resetTyping();if(tab!=='list'){state.editMode=false;state.pendingDelete.clear();state.deleteConfirm=false}render()}
function setScope(s){state.scope=s;state.index=0;state.revealed=false;if(state.tab==='typing')resetTyping();render()}
function setListPage(page){state.listPage=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleStar(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);persist();render()}
function nextCard(){state.index=(state.index+1)%Math.max(1,pool().length);state.revealed=false;render()}
function finishLearning(id){state.learned.add(id);persist();nextCard()}
function rateRecall(id,remembered){if(remembered){state.correct.add(id);state.wrong.delete(id)}else{state.wrong.add(id)}persist();nextCard()}
function keepTypingVisible(input){if(!input)return;const viewport=window.visualViewport;const top=viewport?viewport.offsetTop:0;const height=viewport?viewport.height:window.innerHeight;const rect=input.getBoundingClientRect();const safeBottom=top+height-120;if(rect.bottom>safeBottom){window.scrollBy({top:rect.bottom-safeBottom+18,behavior:'smooth'})}}

function handleSpellingKey(event){if(event.key!=='Enter'||event.isComposing)return;event.preventDefault();if(state.selected!==null){nextQuestion();return}const input=document.getElementById('spelling');answer(input?.value||state.typed)}
function handleSpellingKeyUp(event){if(event.key!=='Enter'||state.selected!==null)return;event.preventDefault();const input=document.getElementById('spelling');answer(input?.value||state.typed)}

function startQuiz(format){
  let p=pool();if(!p.length)return;
  let count=Math.min(state.length,p.length);
  let priority=(state.scope==='all'||typeof state.scope==='number')?shuffle(p.filter(w=>state.wrong.has(w.id))).slice(0,count):[];
  let priorityIds=new Set(priority.map(w=>w.id));
  let others=shuffle(p.filter(w=>!priorityIds.has(w.id)));
  state.format=format;
  state.quiz=shuffle(priority.concat(others.slice(0,count-priority.length)));
  state.quizIndex=0;state.score=0;state.selected=null;state.typed='';state.complete=false;state.keypadMistakes=0;state.keypadWrong='';state.keypadOptions=null;state.hintLevel=0;state.retries=[];state.retried=new Set();state.spellError='';state.spellMissed=false;

}

function answer(value){
  if(state.selected!==null)return;
  let w=state.quiz[state.quizIndex];
  let userAns=typeof value==='string'?value.trim():value;
  let correct=state.format==='choice'?value===w.id:String(userAns).toLowerCase()===w.word.toLowerCase();
  
  state.selected=value;
  state.typed=typeof value==='string'?value:state.typed;

  if(correct){
    state.score+=1;
    state.correct.add(w.id);
    state.wrong.delete(w.id);
  }else{
    state.wrong.add(w.id);
    queueRetry(w.id);
  }
  persist();
  render();
}

function nextQuestion(){
  if(state.quizIndex+1>=state.quiz.length&&state.retries.length){
    state.quiz.push(...state.retries.map(id=>words.find(w=>w.id===id)).filter(Boolean));
    state.retries=[];
  }
  if(state.quizIndex+1>=state.quiz.length){
    state.complete=true;
  }else{
    state.quizIndex++;
    state.selected=null;
    state.typed='';
    state.keypadMistakes=0;
    state.keypadWrong='';
    state.keypadOptions=null;
    state.hintLevel=0;
    state.spellError='';
    state.spellMissed=false;
  }
  render();
  if(!state.complete&&state.format==='keypad'&&state.cue==='sound')setTimeout(()=>speak(state.quiz[state.quizIndex].word),120);
}

function cleanWord(word){return word.toLowerCase().replace(/[^a-z]/g,'')}
function keypadChoices(word){const answer=cleanWord(word),pos=state.typed.length,correct=answer[pos];if(!state.keypadOptions||state.keypadOptions.index!==state.quizIndex||state.keypadOptions.pos!==pos){const alphabet='abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>c!==correct);state.keypadOptions={index:state.quizIndex,pos,items:shuffle(shuffle(alphabet).slice(0,4).concat(correct))}}return state.keypadOptions.items}
function queueRetry(id){if(!state.retried.has(id)){state.retried.add(id);state.retries.push(id)}}
function finishKeypad(w,correct){state.selected=correct?w.id:-1;if(correct){state.score++;state.correct.add(w.id);state.wrong.delete(w.id)}else{state.wrong.add(w.id);queueRetry(w.id)}persist();render()}
function pressKey(letter){if(state.selected!==null)return;const w=state.quiz[state.quizIndex],answer=cleanWord(w.word),correct=answer[state.typed.length];if(letter===correct){state.typed+=letter;state.keypadWrong='';state.keypadOptions=null;if(state.typed===answer)finishKeypad(w,state.keypadMistakes===0);else render()}else{state.keypadMistakes++;state.keypadWrong=letter;render()}}
function eraseKey(){if(state.selected!==null||!state.typed)return;state.typed=state.typed.slice(0,-1);state.keypadOptions=null;state.keypadWrong='';render()}
function giveUpKeypad(){if(state.selected!==null)return;const w=state.quiz[state.quizIndex];state.typed=cleanWord(w.word);state.keypadMistakes++;finishKeypad(w,false)}
function moreHint(){state.hintLevel=Math.min(3,state.hintLevel+1);render()}
function hintText(w){const a=cleanWord(w.word);if(state.hintLevel===1)return `${a.length}글자 단어예요.`;if(state.hintLevel===2)return `첫 글자는 ${a[0].toUpperCase()}예요: ${a[0]}${' _'.repeat(Math.max(0,a.length-1))}`;if(state.hintLevel===3)return `철자를 섞으면 ${shuffle(a.split('')).join(' · ')}예요.`;return ''}

function typingItems(){return state.typingMode==='letters'?shuffle('abcdefghijklmnopqrstuvwxyz'.split('').map((letter,id)=>({id:`letter-${id}`,word:letter,meanings:[`알파벳 ${letter.toUpperCase()}`]}))):shuffle(pool())}
function resetTyping(){state.typingQueue=typingItems();state.typingIndex=0;state.typingValue='';state.typingMessage='';state.typingCorrect=0;state.typingAttempts=0}
function setTypingMode(mode){state.typingMode=mode;resetTyping();render();setTimeout(()=>document.getElementById('typingInput')?.focus(),30)}

function checkTyping(){const w=typingWord();if(!w)return;const input=document.getElementById('typingInput'),value=(input?.value||state.typingValue).trim().toLowerCase();if(!value)return;state.typingAttempts++;if(value===w.word.toLowerCase()){state.typingCorrect++;state.typingMessage='정확해요! 다음 단어로 넘어가요.';state.typingValue='';state.typingIndex++;if(state.typingIndex>=state.typingQueue.length){state.typingQueue=typingItems();state.typingIndex=0}render();setTimeout(()=>document.getElementById('typingInput')?.focus(),30)}else{state.typingMessage='철자를 다시 확인해 보세요.';state.typingValue=input?.value||state.typingValue;render();setTimeout(()=>{const next=document.getElementById('typingInput');next?.focus();next?.select()},30)}}
function skipTyping(){state.typingValue='';state.typingMessage='';state.typingIndex++;if(state.typingIndex>=state.typingQueue.length){state.typingQueue=typingItems();state.typingIndex=0}render();setTimeout(()=>document.getElementById('typingInput')?.focus(),30)}
function nextWordId(){return Math.max(baseWords.length-1,...customWords.map(w=>w.id))+1}
function addWord(){const word=prompt('추가할 영어 단어를 입력하세요.');if(!word||!word.trim())return;const text=prompt('단어 뜻을 입력하세요. 뜻이 여러 개면 | 로 나눠 주세요.');if(text===null||!text.trim())return;upsertWord(word,text);state.listPage=Math.max(0,Math.ceil(orderedWords.length/100)-1);render()}
function editWord(id){const w=words.find(x=>x.id===id);if(!w)return;const word=prompt('영어 단어를 수정하세요.',w.word);if(word===null||!word.trim())return;const text=prompt('뜻을 수정하세요. 뜻이 여러 개면 | 로 나눠 주세요.',w.meanings.join('|'));if(text===null||!text.trim())return;const data={word:word.trim(),meanings:text.split('|').map(x=>x.trim()).filter(Boolean)};if(id<baseWords.length)wordEdits[id]=data;else{const i=customWords.findIndex(x=>x.id===id);if(i>=0)customWords[i]={id,...data}}rebuildWords();persist();render()}

function cancelEditing(){state.editMode=false;state.pendingDelete.clear();state.deleteConfirm=false;render()}

function closeDeleteConfirm(){state.deleteConfirm=false;render()}

function upsertWord(word,text){const clean=word.trim().replace(/\s+/g,' '),meanings=String(text).split('|').map(x=>x.trim()).filter(Boolean);if(!clean||!meanings.length)return false;const existing=words.find(w=>w.word.toLowerCase()===clean.toLowerCase());if(existing){const data={word:clean,meanings};if(existing.id<baseWords.length)wordEdits[existing.id]=data;else{const i=customWords.findIndex(x=>x.id===existing.id);customWords[i]={id:existing.id,...data}}}else customWords.push({id:nextWordId(),word:clean,meanings});rebuildWords();persist();return true}
function parseOCRText(text){const out=[],lines=String(text).split(/\n+/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean);for(let i=0;i<lines.length;i++){let line=lines[i],m=line.match(/^([A-Za-z][A-Za-z' -]{0,40})\s+(.+)$/);if(m&&/[가-힣]/.test(m[2])){out.push(`${m[1].trim()} | ${m[2].trim()}`);continue}if(/^[A-Za-z][A-Za-z' -]{0,40}$/.test(line)&&lines[i+1]&&/[가-힣]/.test(lines[i+1])){out.push(`${line} | ${lines[++i]}`)}}return [...new Set(out)]}

}

function learn(){let p=pool(),w=current();return `<p class="eyebrow">차근차근 학습</p><h1>단어와 뜻 익히기</h1><p class="sub">단어와 뜻을 함께 보고 발음을 들으며 익혀 보세요.</p>${filters()}${!w?`<div class="empty">이 목록에는 아직 단어가 없어요.<br>다른 목록을 선택해 주세요.</div>`:`<div class="panel"><div class="row between"><span class="small">${state.index+1} / ${p.length} · 학습 완료 ${state.learned.size}개</span><button class="star ${state.favorites.has(w.id)?'saved':''}" aria-label="${state.favorites.has(w.id)?'즐겨찾기 해제':'즐겨찾기 추가'}" onclick="toggleStar(${w.id})">★</button></div><div class="progress"><i style="width:${(state.index+1)/p.length*100}%"></i></div><div class="flash"><div class="word">${escapeHTML(w.word)}</div><div style="width:54px;height:3px;background:#dce4f5;border-radius:3px;margin:24px 0"></div><div class="meaning">${escapeHTML(meaning(w))}</div><button class="sound" onclick="speak('${w.word}')" aria-label="${w.word} 발음 듣기">🔊</button></div><div class="actions"><button class="btn secondary" onclick="state.index=Math.max(0,state.index-1);render()" ${state.index===0?'disabled':''}>이전</button><button class="btn secondary" onclick="nextCard()">다음</button><button class="btn grow" onclick="finishLearning(${w.id})">${state.learned.has(w.id)?'✓ 학습했어요':'학습 완료'}</button></div></div>`}`}

function quiz(){return `<p class="eyebrow">단어 시험</p><h1>얼마나 기억하나요?</h1><p class="sub">시험은 끝까지 풀면 점수를 볼 수 있어요.</p>${filters()}${!state.quiz?`<div class="panel"><p style="font-weight:800;margin:0 0 15px">시험 방식</p><div class="controls"><button class="pill ${state.format==='choice'?'on':''}" onclick="state.format='choice';render()">뜻 고르기</button><button class="pill ${state.format==='spell'?'on':''}" onclick="state.format='spell';render()">직접 철자 쓰기</button><button class="pill ${state.format==='keypad'?'on':''}" onclick="state.format='keypad';render()">5자 키보드 게임</button></div>${state.format==='keypad'?`<div class="cue-choice"><span class="small">무엇을 보고 맞힐까요?</span><div class="controls"><button class="pill ${state.cue==='meaning'?'on':''}" onclick="state.cue='meaning';render()">의미 보고</button><button class="pill ${state.cue==='sound'?'on':''}" onclick="state.cue='sound';render()">발음 듣고</button></div></div>`:''}<label for="length" class="small">문제 수　</label><select id="length" onchange="state.length=Number(this.value)"><option value="10" ${state.length===10?'selected':''}>10문제</option><option value="30" ${state.length===30?'selected':''}>30문제</option><option value="1000" ${state.length===1000?'selected':''}>전체</option></select><p class="small">${state.format==='keypad'?'정답 글자 1개와 다른 글자 4개가 매번 새로 나와요. 틀린 단어는 마지막에 한 번 더 출제해요.':`${pool().length}개 단어에서 무작위로 출제해요.`}</p><button class="btn" onclick="startQuiz(state.format)" ${pool().length===0?'disabled':''}>시험 시작</button></div>`:state.complete?`<div class="panel summary"><p class="eyebrow">시험 완료</p><div class="score">${state.score} / ${state.quiz.length}</div><p>틀린 단어는 오답노트에서 다시 볼 수 있어요.</p><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="nav('wrong')">오답 보기</button><button class="btn" onclick="state.quiz=null;render()">다시 시험 보기</button></div></div>`:question()}`}
function keypadQuestion(w){const done=state.selected!==null,wasRight=state.selected===w.id,answer=cleanWord(w.word),slots=(state.typed+'＿'.repeat(Math.max(0,answer.length-state.typed.length))).split('').join(' '),choices=done?[]:keypadChoices(w.word);return `<div class="panel"><div class="row between"><span class="small">문제 ${state.quizIndex+1} / ${state.quiz.length}</span><span class="small">맞힌 문제 ${state.score}개</span></div><div class="progress"><i style="width:${(state.quizIndex+1)/state.quiz.length*100}%"></i></div><div class="keypad-prompt">${state.cue==='sound'?`<button class="sound" onclick="speak('${w.word}')" aria-label="발음 다시 듣기">🔊</button><p class="small">발음을 듣고 단어를 완성하세요.</p>`:`<div class="meaning">${escapeHTML(meaning(w))}</div><button class="sound" onclick="speak('${w.word}')" aria-label="발음 듣기">🔊</button>`}</div>${done?`<div class="${wasRight?'answer-slots':'answer-slots wrong'}">${escapeHTML(answer)}</div><div class="answer ${wasRight?'ok':'no'}">${wasRight?'정답이에요!':`<span class="try-again">아쉬워요🥹</span><br><span class="answer-word"><strong>정답: ${escapeHTML(w.word)} · ${escapeHTML(meaning(w))}</strong><button class="answer-sound" type="button" onclick="speak('${w.word}')" aria-label="${escapeHTML(w.word)} 발음 듣기">🔊</button></span><br>마지막에 다시 나와요.`}</div><button class="btn" onclick="nextQuestion()">${state.quizIndex+1===state.quiz.length&&state.retries.length===0?'결과 보기':'다음 문제'}</button>`:`<div class="answer-slots" aria-label="입력한 철자">${escapeHTML(slots)}</div>${state.hintLevel?`<div class="hint-panel">💡 ${escapeHTML(hintText(w))}</div>`:''}<div class="row between"><button class="pill" onclick="moreHint()" ${state.hintLevel===3?'disabled':''}>힌트 ${state.hintLevel}/3</button><button class="pill" onclick="giveUpKeypad()">모름</button></div><div class="keypad">${choices.map(letter=>`<button class="key ${state.keypadWrong===letter?'wrong':''}" onclick="pressKey('${letter}')">${letter}</button>`).join('')}<button class="key back" onclick="eraseKey()" aria-label="한 글자 지우기">⌫</button></div>`}</div>`}

function question(){
  let w=state.quiz[state.quizIndex],done=state.selected!==null;
  let options=shuffle(words.filter(x=>x.id!==w.id)).slice(0,3).concat(w);
  if(state.format==='keypad')return keypadQuestion(w);
  if(state.format==='choice'){if(!state.quizOptions||state.quizOptions.index!==state.quizIndex){state.quizOptions={index:state.quizIndex,items:shuffle(options)}}options=state.quizOptions.items}
  
  let wasRight=state.format==='choice'?state.selected===w.id:String(state.selected||'').trim().toLowerCase()===w.word.toLowerCase();

  return `<div class="panel">
    <div class="row between">
      <span class="small">문제 ${state.quizIndex+1} / ${state.quiz.length}</span>
      <span class="small">${state.format==='choice'?'알맞은 뜻을 고르세요':'영어 단어를 쓰세요'}</span>
    </div>
    <div class="progress"><i style="width:${(state.quizIndex+1)/state.quiz.length*100}%"></i></div>
    <div class="question">${escapeHTML(state.format==='choice'?w.word:meaning(w))}</div>
    ${state.format==='choice'
      ? options.map(o=>`<button class="option ${done?(o.id===w.id?'correct':state.selected===o.id?'wrong':''):''}" onclick="answer(${o.id})" ${done?'disabled':''}>${escapeHTML(meaning(o))}</button>`).join('')
      : `<form class="spell-form" onsubmit="event.preventDefault();if(state.selected!==null){nextQuestion()}else{answer(document.getElementById('spelling').value)}">
          <div class="typing-label">입력 중인 영어 단어</div>
          <label class="sr" for="spelling">영어 철자</label>
          <input id="spelling" class="input" type="text" autocomplete="off" autocapitalize="none" enterkeyhint="done" spellcheck="false" placeholder="영어 단어 입력" value="${escapeHTML(state.typed)}" oninput="state.typed=this.value;" onkeydown="handleSpellingKey(event)" onkeyup="handleSpellingKeyUp(event)" onfocus="openKeyboard(this)" onblur="closeKeyboard()" ${done?'disabled':''}>
          <div style="height:13px"></div>
          ${!done?'<button class="btn" type="submit">정답 확인</button>':''}
        </form>`
    }
    ${done?`
      <div class="answer ${wasRight?'ok':'no'}">
        ${wasRight
          ?(state.format==='choice'?`<span class="answer-word"><strong>정답이에요!</strong><button class="answer-sound" type="button" onclick="speak('${w.word}')" aria-label="${escapeHTML(w.word)} 발음 듣기">🔊</button></span>`:'정답이에요!')
          :`아쉬워요🥹<br><span class="answer-word"><strong>정답: ${escapeHTML(w.word)} · ${escapeHTML(meaning(w))}</strong><button class="answer-sound" type="button" onclick="speak('${w.word}')" aria-label="${escapeHTML(w.word)} 발음 듣기">🔊</button></span>`
        }
      </div>
      <button class="btn" onclick="nextQuestion()">${state.quizIndex+1===state.quiz.length&&state.retries.length===0?'결과 보기':'다음 문제'}</button>
    `:''}
  </div>`;
}

function list(which){let all=which==='wrong'?words.filter(w=>state.wrong.has(w.id)):orderedWords,pageSize=100,pageCount=Math.ceil(all.length/pageSize);state.listPage=Math.min(state.listPage,Math.max(0,pageCount-1));let p=which==='wrong'?all:all.slice(state.listPage*pageSize,(state.listPage+1)*pageSize);let pages=which==='wrong'?'':`<div class="controls" aria-label="단어 묶음 선택">${Array.from({length:pageCount},(_,i)=>{let start=i*pageSize+1,end=Math.min((i+1)*pageSize,all.length);return `<button class="pill ${state.listPage===i?'on':''}" onclick="setListPage(${i})">${start}–${end}</button>`}).join('')}</div>`;let tools=which==='wrong'?'':`<section class="panel word-tools"><div class="word-tools-head"><h2>단어 관리</h2>${state.editMode?`<div class="edit-actions"><button class="mini-btn" onclick="cancelEditing()">취소</button><button class="mini-btn done" onclick="finishEditing()">완료</button></div>`:`<button class="mini-btn" onclick="startEditing()">편집</button>`}</div><p class="small">직접 입력하거나 단어장 사진을 올려 단어를 추가·수정할 수 있어요.</p><div class="actions"><button class="btn" onclick="addWord()">＋ 단어 추가</button><label class="btn secondary upload-btn" for="wordPhoto">📷 사진에서 가져오기</label><input class="sr" id="wordPhoto" type="file" accept="image/*" onchange="recognizePhoto(this)"></div><p class="manage-note">사진 인식 결과는 저장 전에 수정할 수 있어요. 변경 내용은 현재 기기에 저장됩니다.</p>${state.ocrBusy?`<p class="ocr-status" id="ocrStatus">${escapeHTML(state.ocrProgress)}</p>`:''}${state.importMessage?`<p class="ocr-status">${escapeHTML(state.importMessage)}</p>`:''}${state.importText||(!state.ocrBusy&&state.importMessage)?`<div class="import-box"><label for="importWords" class="small">한 줄에 단어 | 뜻 형식</label><textarea id="importWords" oninput="state.importText=this.value" placeholder="camel | 낙타\nviolin | 바이올린">${escapeHTML(state.importText)}</textarea><div class="actions"><button class="btn" onclick="saveImportedWords()">인식한 단어 저장</button><button class="btn secondary" onclick="state.importText='';state.importMessage='';render()">취소</button></div></div>`:''}</section>`;let confirmDialog=state.deleteConfirm?`<div class="confirm-backdrop" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><div class="confirm-dialog"><h2 id="deleteTitle">정말 삭제하시겠습니까?</h2><p>선택한 ${state.pendingDelete.size}개 단어가 삭제됩니다.</p><div class="confirm-actions"><button class="cancel" onclick="closeDeleteConfirm()">취소</button><button class="danger" onclick="confirmPendingDeletes()">확인</button></div></div></div>`:'';return `<p class="eyebrow">${which==='wrong'?'다시 복습':'단어 모아보기'}</p><h1>${which==='wrong'?'오답노트':'전체 단어'}</h1><p class="sub">${which==='wrong'?`틀린 단어 ${p.length}개를 다시 외워보세요.`:`촬영 순서대로 정리한 ${all.length}개 단어예요. 100개씩 묶어서 확인하세요.`}</p>${tools}${pages}${which==='wrong'&&p.length?'<button class="btn" style="margin-bottom:16px" onclick="state.scope=\'wrong\';nav(\'quiz\')">오답만 시험 보기</button>':''}${p.length?`<div class="list">${p.map((w,i)=>`<div class="item ${state.pendingDelete.has(w.id)?'pending-delete':''}"><span class="small" style="min-width:34px">${which==='wrong'?'':state.listPage*pageSize+i+1}</span><div class="text"><strong>${escapeHTML(w.word)}</strong><p>${escapeHTML(meaning(w))}</p></div><button class="speak" onclick="speak('${w.word}')" aria-label="${w.word} 발음 듣기">🔊</button><button class="star ${state.favorites.has(w.id)?'saved':''}" onclick="toggleStar(${w.id})" aria-label="즐겨찾기">★</button>${which==='wrong'||!state.editMode?'':`<div class="manage-buttons"><button class="mini-btn" onclick="editWord(${w.id})">수정</button><button class="mini-btn delete" onclick="stageDelete(${w.id})">${state.pendingDelete.has(w.id)?'삭제 취소':'삭제'}</button></div>`}</div>`).join('')}</div>`:`<div class="empty">아직 틀린 단어가 없어요.<br>시험을 풀면 여기에서 다시 볼 수 있어요.</div>`}${confirmDialog}`}
function typing(){let w=typingWord(),accuracy=state.typingAttempts?Math.round(state.typingCorrect/state.typingAttempts*100):100,isMeaning=state.typingMode==='meaning',isLetters=state.typingMode==='letters',prompt=w?(isMeaning?meaning(w):w.word):'',helper=isMeaning?'뜻에 맞는 영어 단어를 입력하세요.':isLetters?'보이는 알파벳 한 글자를 입력하세요.':'보이는 영어 단어를 그대로 입력하세요.';return `<p class="eyebrow">영어 타자 연습</p><h1>단계별로 타자를 익혀 보세요</h1><p class="sub">알파벳 한 글자부터 단어장 속 영어 단어까지 연습할 수 있어요.</p><div class="controls"><button class="pill ${isLetters?'on':''}" onclick="setTypingMode('letters')">한 글자 연습</button><button class="pill ${state.typingMode==='copy'?'on':''}" onclick="setTypingMode('copy')">단어 따라 쓰기</button><button class="pill ${isMeaning?'on':''}" onclick="setTypingMode('meaning')">뜻 보고 쓰기</button></div>${isLetters?'':filters()}${!w?`<div class="empty">이 목록에는 아직 단어가 없어요.<br>다른 목록을 선택해 주세요.</div>`:`<div class="panel typing-card"><div class="row between"><span class="small">${state.typingIndex+1} / ${state.typingQueue.length}</span>${isLetters?'':`<button class="sound" style="margin:0" onclick="speak('${w.word}')" aria-label="${escapeHTML(w.word)} 발음 듣기">🔊</button>`}</div><div class="typing-target">${escapeHTML(prompt)}</div>${isMeaning?'':`<p class="typing-meaning">${escapeHTML(meaning(w))}</p>`}<p class="small">${helper}</p><form onsubmit="event.preventDefault();checkTyping()"><label class="sr" for="typingInput">영어 입력</label><input id="typingInput" class="input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" maxlength="${isLetters?1:60}" placeholder="${isLetters?'알파벳 한 글자 입력':'영어 단어 입력'}" value="${escapeHTML(state.typingValue)}" oninput="state.typingValue=this.value;state.typingMessage=''" onfocus="openKeyboard(this)" onblur="closeKeyboard()"><div class="typing-result ${state.typingMessage.startsWith('정확')?'ok':state.typingMessage?'no':''}">${escapeHTML(state.typingMessage)}</div><div class="actions"><button class="btn secondary" type="button" onclick="skipTyping()">건너뛰기</button><button class="btn grow" type="submit">입력 확인</button></div></form><div class="typing-stats"><span>정확히 입력 <strong>${state.typingCorrect}개</strong></span><span>정확도 <strong>${accuracy}%</strong></span></div></div>`}`}

function render(){document.getElementById('app').innerHTML=header()+`<div class="layout">${navigation()}<main class="main">${state.tab==='learn'?learn():state.tab==='recall'?recall():state.tab==='quiz'?quiz():state.tab==='typing'?typing():list(state.tab)}<p class="footnote">학습 기록은 지금 사용 중인 기기에 저장돼요. 사진의 인쇄 내용은 직접 확인해 옮겼으니 원본과 비교해 주세요.</p></main></div>`}

if(document.modelContext?.registerTool){
  const register=(tool)=>{try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}};
  register({name:'list_vocabulary',title:'단어 목록 보기',description:'현재 단어장의 영어 단어와 뜻을 읽습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({words:words.map(w=>({word:w.word,meanings:w.meanings}))})});
  register({name:'start_vocabulary_quiz',title:'단어 시험 시작',description:'현재 선택한 목록에서 객관식, 철자 입력 또는 5자 키보드 시험을 시작하고 화면을 전환합니다.',inputSchema:{type:'object',properties:{format:{type:'string',enum:['choice','spell','keypad']},count:{type:'integer',minimum:1,maximum:60}},required:['format','count'],additionalProperties:false},execute:(input)=>{if(!input||!['choice','spell','keypad'].includes(input.format)||!Number.isInteger(input.count)||input.count<1||input.count>60)throw Error('유효한 format과 1~60 사이의 count가 필요합니다.');state.tab='quiz';state.length=input.count;startQuiz(input.format);return{started:!!state.quiz,count:state.quiz?.length||0,format:input.format}}});
}

if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const input=document.activeElement;if(input?.id==='spelling')setTimeout(()=>keepTypingVisible(input),30)})}
render();
</script></body></html>
